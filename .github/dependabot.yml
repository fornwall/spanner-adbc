# Git-pinned dependencies are updated by hand; see CONTRIBUTING.md.
version: 2
updates:
  - package-ecosystem: github-actions
    # "/" covers only .github/workflows, so list the composite action too.
    directories:
      - "/"
      - "/.github/actions/setup-rust"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
