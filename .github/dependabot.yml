# Monitor GitHub Actions and registry Cargo dependencies. Coordinate git-pinned
# dependency updates across Cargo and validation harnesses; see CLAUDE.md.
version: 2
updates:
  - package-ecosystem: github-actions
    # "/" scans the workflow files; the composite action's action.yml lives outside
    # .github/workflows, so list its directory explicitly to keep its SHA-pinned
    # dtolnay/rust-toolchain monitored too.
    directories:
      - "/"
      - "/.github/actions/setup-rust"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
