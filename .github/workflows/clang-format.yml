name: clang-format

# Keep the push and pull_request path lists in sync.
on:
  push:
    branches: [main]
    paths:
      - 'adbc-validation/**.cc'
      - 'adbc-validation/.clang-format'
      - '.github/workflows/clang-format.yml'
  pull_request:
    paths:
      - 'adbc-validation/**.cc'
      - 'adbc-validation/.clang-format'
      - '.github/workflows/clang-format.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  clang-format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pin the formatter so local and CI formatting agree.
      - name: Install clang-format
        run: |
          pipx install clang-format==23.1.3
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check formatting
        run: clang-format --dry-run --Werror --verbose adbc-validation/*.cc
