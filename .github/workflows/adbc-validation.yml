name: ADBC validation

# Build the Apache Arrow ADBC C++ validation suite against the driver's C ABI.
# See adbc-validation/README.md for coverage and sanitizer settings.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validation:
    name: validation (${{ matrix.name }}, ${{ matrix.backend }})
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        name: [plain, asan-ubsan, rust-asan]
        backend: [emulator, omni]
        include:
          - name: plain
            sanitize: ""
            rust-sanitize: ""
            toolchain: stable
          - name: asan-ubsan
            sanitize: address,undefined
            rust-sanitize: ""
            toolchain: stable
          - name: rust-asan
            sanitize: address
            rust-sanitize: address
            toolchain: nightly

    env:
      ADBC_VALIDATION_SANITIZE: ${{ matrix.sanitize }}
      ADBC_VALIDATION_RUST_SANITIZE: ${{ matrix.rust-sanitize }}
      ADBC_VALIDATION_BUILD_DIR: ${{ github.workspace }}/.adbc-validation-build-${{ matrix.name }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain (stable)
        if: matrix.toolchain == 'stable'
        uses: ./.github/actions/setup-rust

      - name: Install Rust toolchain (nightly, for the -Zsanitizer=address cdylib)
        # rust-src lets -Zbuild-std instrument the standard library.
        if: matrix.toolchain == 'nightly'
        uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly branch, 2026-10-16
        with:
          toolchain: nightly
          components: rust-src

      # Mixing GCC's libasan with Rust's compiler-rt ASan aborts at startup.
      - name: Install clang (compiler-rt ASan, to match the instrumented cdylib)
        if: matrix.rust-sanitize != ''
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: "23.1.3"
          # The action's bundled release list predates LLVM 23.
          force-url: https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.3/LLVM-23.1.3-Linux-X64.tar.xz
          directory: ${{ runner.temp }}/llvm
          env: true

      - name: Install CMake
        run: |
          pipx install cmake==4.4.4
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Compiler and sanitizer settings require a distinct build tree per leg.
      # No restore-keys: an old CMakeCache could retain a stale upstream checkout.
      - name: Cache the ADBC C++ validation build tree
        uses: actions/cache@v6
        with:
          path: ${{ env.ADBC_VALIDATION_BUILD_DIR }}
          key: adbc-validation-${{ runner.os }}-${{ matrix.name }}-${{ hashFiles('adbc-validation/CMakeLists.txt', '.github/workflows/adbc-validation.yml') }}

      - name: Build validation harness and check upstream test inventory
        run: scripts/run-adbc-validation.sh --check-drift

      - name: Run the ADBC C++ validation suite (${{ matrix.backend }})
        run: scripts/with-${{ matrix.backend }}.sh scripts/run-adbc-validation.sh
