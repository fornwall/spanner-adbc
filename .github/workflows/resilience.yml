name: Resilience (fault injection)

# Exercise cancellation and recovery through a Toxiproxy transport-fault proxy.
# Spanner status-code faults such as ABORTED are covered separately; see tests/RESILIENCE.md.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "30 4 * * *" # daily at 04:30 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  resilience:
    name: Resilience harness (emulator + Toxiproxy)
    runs-on: ubuntu-latest
    # Bound Docker startup and other work outside the test watchdogs.
    timeout-minutes: 30

    # Fail if the wrapper does not provide a test target.
    env:
      ADBC_TEST_REQUIRE_TARGET: "1"

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # Build before starting the disposable emulator and proxy containers.
      - name: Build
        run: cargo test --test resilience --no-run

      - name: Run the resilience harness
        run: |
          scripts/with-toxiproxy.sh \
            cargo test --test resilience -- --nocapture

  # Keep scheduled failures visible in one tracking issue.
  report-failure:
    needs: resilience
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          label="nightly-resilience-failure"
          title="Nightly resilience run failed"
          gh label create "$label" --color B60205 \
            --description "Automated: a scheduled resilience run failed" 2>/dev/null || true
          body="A scheduled [resilience run]($RUN_URL) failed (commit ${GITHUB_SHA})."
          existing="$(gh issue list --state open --label "$label" --limit 1 --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --label "$label" --body "$body"
          fi
