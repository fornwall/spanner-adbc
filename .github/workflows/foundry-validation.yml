name: Foundry validation

# Run Foundry type/feature validation with GoogleSQL overrides and a fixed skip baseline.
# See foundry-validation/README.md; C ABI conformance runs in adbc-validation.yml.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  foundry-validation:
    name: Foundry validation (${{ matrix.backend }})
    runs-on: ubuntu-latest

    # Cold installs may build DuckDB and the driver manager for the newest Python.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        backend: [emulator, omni]

    env:
      # Require at least one passing case; pytest otherwise accepts an all-skip run.
      FOUNDRY_VALIDATION_REQUIRE_PASSES: "1"
      # Require skips to match foundry-validation/skip_baseline.txt.
      # Regenerate it with FOUNDRY_UPDATE_SKIP_BASELINE=1.
      FOUNDRY_VALIDATION_CHECK_SKIP_BASELINE: "1"

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - uses: actions/setup-python@v7
        with:
          # The suite requires Python 3.13 or newer.
          python-version: "3.x"
          check-latest: true
          cache: pip
          cache-dependency-path: |
            python/pyproject.toml
            scripts/run-foundry-validation.sh

      - name: Build the driver and install validation dependencies
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
        run: PYTHON=python scripts/run-foundry-validation.sh --prepare

      - name: Run the Foundry validation suite
        run: PYTHON=python scripts/with-${{ matrix.backend }}.sh scripts/run-foundry-validation.sh
