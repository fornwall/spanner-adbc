name: Foundry validation

# Run Foundry type/feature validation with GoogleSQL overrides and a fixed skip baseline.
# See foundry-validation/README.md; C ABI conformance runs in adbc-validation.yml.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  foundry-validation:
    name: Foundry validation (${{ matrix.backend }})
    runs-on: ubuntu-latest

    # Omni's schema operations dominate runtime even with cached dependencies.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        backend: [emulator, omni]

    env:
      # Query lint passes alone do not prove the backend tests ran.
      FOUNDRY_VALIDATION_REQUIRE_PASSES: "1"
      # Require skips to match foundry-validation/skip_baseline.txt.
      # Regenerate it with FOUNDRY_UPDATE_SKIP_BASELINE=1.
      FOUNDRY_VALIDATION_CHECK_SKIP_BASELINE: "1"

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - uses: actions/setup-python@v7
        with:
          # Use available dependency wheels; the Python package CI covers latest Python.
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scripts/run-foundry-validation.sh

      - name: Build the driver and install validation dependencies
        run: PYTHON=python scripts/run-foundry-validation.sh --prepare

      - name: Test the validation harness guards
        if: matrix.backend == 'emulator'
        run: python -m pytest foundry-validation/harness_tests -q

      - name: Run the Foundry validation suite
        run: PYTHON=python scripts/with-${{ matrix.backend }}.sh scripts/run-foundry-validation.sh --no-prepare --durations=20
