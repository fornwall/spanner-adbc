name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Rust (${{ matrix.backend }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        backend: [emulator, omni]
    env:
      ADBC_TEST_REQUIRE_TARGET: "1"

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Check formatting
        if: matrix.backend == 'emulator'
        run: cargo fmt --all --check

      - name: Clippy
        if: matrix.backend == 'emulator'
        # --workspace checks the fuzz harnesses, which otherwise only build in the nightly fuzz
        # workflow; --all-features lints the `fuzzing` helper module.
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Docs (deny warnings / broken links)
        if: matrix.backend == 'emulator'
        env:
          RUSTDOCFLAGS: "-D warnings"
        # --all-features to match how docs.rs builds the docs.
        run: cargo doc --no-deps --all-features

      - name: Build without default features (ffi off)
        if: matrix.backend == 'emulator'
        run: cargo build --no-default-features

      - name: Build the shared library (for the FFI smoke test)
        run: cargo build

      - name: Mock-server fault-injection tests
        if: matrix.backend == 'emulator'
        run: cargo test --test mock_spanner

      - name: Unit tests
        if: matrix.backend == 'emulator'
        # Include fuzz helper tests and seed-corpus checks without libFuzzer.
        run: cargo test --lib --features fuzzing

      - name: Doctests
        if: matrix.backend == 'emulator'
        # Doctests are excluded from --lib and --all-targets.
        run: cargo test --doc --all-features

      - name: Integration tests (${{ matrix.backend }})
        # Register new target-dependent test binaries here.
        run: scripts/with-${{ matrix.backend }}.sh cargo test --test integration --test ffi_lifecycle

  python:
    name: Python package (${{ matrix.backend }}, py${{ matrix.python-version }})
    runs-on: ubuntu-latest

    # Cover the minimum supported Python and the latest stable release.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.x"]
        backend: [emulator, omni]

    # New Python releases may need native dependency builds before wheels ship.
    timeout-minutes: 60
    env:
      ADBC_TEST_REQUIRE_TARGET: "1"

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          check-latest: true
          cache: pip
          cache-dependency-path: |
            python/pyproject.toml
            scripts/run-foundry-validation.sh

      - name: Build the driver shared library
        run: cargo build

      - name: Install the Python package with the freshly built driver
        env:
          # Bound DuckDB source-build memory while cp315 wheels are unavailable.
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
        run: |
          set -euo pipefail
          cp target/debug/libspanner_adbc.so python/spanner_adbc/
          python -m pip install --upgrade pip
          # Include DataFrame/cookbook dependencies and the official client for differential tests.
          python -m pip install --upgrade ./python pyarrow pandas polars duckdb pytest google-cloud-spanner 'setuptools>=77'

      - name: End-to-end tests
        run: scripts/with-${{ matrix.backend }}.sh python -m pytest python/tests -v

      - name: End-to-end tests with the minimum adbc-driver-manager
        if: matrix.python-version == '3.11' && matrix.backend == 'emulator'
        run: |
          set -euo pipefail
          minimum="$(python -c 'import re, tomllib; deps = tomllib.load(open("python/pyproject.toml", "rb"))["project"]["dependencies"]; print(next(m[1] for d in deps if (m := re.fullmatch(r"adbc-driver-manager>=([0-9.]+)", d))))')"
          python -m pip install "adbc-driver-manager==${minimum}"
          scripts/with-emulator.sh python -m pytest python/tests -v

  # The image includes shellcheck and pyflakes to lint embedded scripts too.
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Lint GitHub Actions workflows
        run: docker run --rm -v "${PWD}:/repo" --workdir /repo rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color # 1.7.12

      - name: Test backend wrappers and setup
        run: python3 -m unittest discover -s scripts/tests -v

  supply-chain:
    name: cargo-deny + machete
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-machete@0.9.2

      - name: Unused dependencies
        run: cargo machete
