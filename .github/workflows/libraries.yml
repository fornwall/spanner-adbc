name: Shared libraries

# Build the loadable ADBC driver shared library for every supported platform.
# Artifacts are attached to each run (downloadable from the run's summary page),
# and, for tag pushes, also uploaded as assets on the corresponding GitHub Release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Cancel superseded PR runs; let branch and release builds complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Keep the runner glibc version and manylinux wheel tags in sync.
          # The glibc-symbol check below verifies compatibility.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            lib: libspanner_adbc.so
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
            lib: libspanner_adbc.so
          # Musl libraries use the Alpine job below. Keep macOS deployment targets
          # in sync with wheel tags; they match the driver-manager wheel minimums.
          - target: aarch64-apple-darwin
            runner: macos-26
            lib: libspanner_adbc.dylib
            macos_deployment_target: "11.0"
          - target: x86_64-apple-darwin
            runner: macos-26 # cross-compiled from the arm64 runner (Apple toolchain is universal).
            lib: libspanner_adbc.dylib
            macos_deployment_target: "10.15"
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            lib: spanner_adbc.dll
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm # native ARM64 Windows; aws-lc-rs cross-compiles poorly, native is clean.
            lib: spanner_adbc.dll

    steps:
      - uses: actions/checkout@v7

      # Third-party actions are SHA-pinned; trailing comments identify their releases.
      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}

      # aws-lc-sys needs NASM to assemble on Windows x86-64. ARM64 Windows uses no NASM.
      - name: Install NASM (Windows x86-64)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2
        with:
          version: "3.02"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: Build shared library
        env:
          # rustc, cc and aws-lc CMake use this minimum macOS version.
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_deployment_target }}
        run: cargo build --release --target ${{ matrix.target }}

      # Reject libraries requiring a newer glibc than the manylinux wheel tag allows.
      - name: Verify glibc requirement matches the manylinux_2_35 wheel tag
        if: contains(matrix.target, 'linux-gnu')
        run: |
          set -euo pipefail
          lib="target/${{ matrix.target }}/release/${{ matrix.lib }}"
          required="$(objdump -T "$lib" | { grep -oE 'GLIBC_[0-9]+(\.[0-9]+)+' || true; } \
            | sed 's/^GLIBC_//' | sort -uV | tail -1)"
          echo "highest glibc symbol version required by ${lib}: ${required}"
          if [ "$(printf '%s\n' "$required" 2.35 | sort -V | tail -1)" != "2.35" ]; then
            echo "::error::${{ matrix.lib }} requires glibc ${required}, which breaks the manylinux_2_35 wheel tag (see the python-wheels job)" >&2
            exit 1
          fi

      # Reject libraries requiring a newer macOS than the wheel tag allows.
      - name: Verify the minimum macOS matches the wheel tag
        if: contains(matrix.target, 'apple-darwin')
        run: |
          set -euo pipefail
          lib="target/${{ matrix.target }}/release/${{ matrix.lib }}"
          expected="${{ matrix.macos_deployment_target }}"
          # Modern binaries carry LC_BUILD_VERSION (minos); binaries targeting old
          # x86_64 deployment targets get LC_VERSION_MIN_MACOSX (version) instead.
          minos="$(otool -l "$lib" | awk '/LC_BUILD_VERSION/{v=1} v && /minos/{print $2; exit}')"
          if [ -z "$minos" ]; then
            minos="$(otool -l "$lib" | awk '/LC_VERSION_MIN_MACOSX/{v=1} v && /version/{print $2; exit}')"
          fi
          echo "minimum macOS required by ${lib}: ${minos:-<none found>} (wheel tag promises ${expected})"
          if [ -z "$minos" ] || [ "$(printf '%s\n' "$minos" "$expected" | sort -V | tail -1)" != "$expected" ]; then
            echo "::error::${{ matrix.lib }} requires macOS ${minos:-unknown}, which breaks the macosx_${expected/./_} wheel tag (see the python-wheels job)" >&2
            exit 1
          fi

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          staging="spanner-adbc-${{ matrix.target }}"
          mkdir -p "$staging" dist
          cp "target/${{ matrix.target }}/release/${{ matrix.lib }}" "$staging/"
          cp README.md LICENSE "$staging/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            # Include the MSVC import library for consumers that link at build time.
            implib="target/${{ matrix.target }}/release/spanner_adbc.dll.lib"
            if [ ! -f "$implib" ]; then
              echo "::error::expected Windows import library $implib is missing" >&2
              exit 1
            fi
            cp "$implib" "$staging/"
            7z a "dist/${staging}.zip" "$staging"
          else
            tar -czf "dist/${staging}.tar.gz" "$staging"
          fi
          ls -l dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: spanner-adbc-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # Build musl libraries natively in Alpine so aws-lc and libgcc link against musl.
  # Disable crt-static: Rust otherwise omits the cdylib for musl targets.
  # Only compilation runs in the container; JavaScript actions run on the host.
  build-musl:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # The image digest covers both architectures; Rust still follows rust-toolchain.toml.
      # Image: rust:1.99.1-alpine3.24.
      - name: Build shared library (Alpine/musl)
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD":/work -w /work \
            -e CARGO_TARGET_DIR=/work/target \
            -e RUSTFLAGS="-C target-feature=-crt-static" \
            rust@sha256:557a94c82b485a14b569120e00867267108c734efe33f10cc31ca0cd5dd1eca9 \
            sh -euc '
              apk add --no-cache build-base cmake perl git
              cargo build --release
            '

      # Verify musllinux compatibility and the exported driver entrypoint.
      - name: Verify the library is a musl (not glibc) shared object
        run: |
          set -euo pipefail
          lib="target/release/libspanner_adbc.so"
          if [ ! -f "$lib" ]; then
            echo "::error::musl build produced no cdylib at $lib (crt-static dropping it?)" >&2
            exit 1
          fi
          # GCC's aarch64 crtbeginS.o has weak GLIBC-tagged frame hooks that musl
          # leaves NULL. Only required (non-weak) symbols indicate a glibc dependency.
          strong="$(readelf -W --dyn-syms "$lib" \
            | awk '$8 ~ /@GLIBC_/ && $7 == "UND" && $5 != "WEAK" { print $8 }' || true)"
          if [ -n "$strong" ]; then
            echo "::error::$lib requires glibc symbols — not a musl build" >&2
            printf '%s\n' "$strong" >&2
            exit 1
          fi
          weak="$(readelf -W --dyn-syms "$lib" \
            | awk '$8 ~ /@GLIBC_/ && $7 == "UND" && $5 == "WEAK" { print $8 }' || true)"
          if [ -n "$weak" ]; then
            echo "note: ignoring harmless weak-undefined glibc-tagged symbols (musl leaves them NULL):"
            printf '  %s\n' "$weak"
          fi
          if ! nm -D --defined-only "$lib" | grep -q AdbcSpannerInit; then
            echo "::error::$lib does not export AdbcSpannerInit" >&2
            exit 1
          fi
          echo "OK: $lib is a musl shared object exporting AdbcSpannerInit"

      - name: Package
        run: |
          set -euo pipefail
          staging="spanner-adbc-${{ matrix.target }}"
          mkdir -p "$staging" dist
          cp target/release/libspanner_adbc.so "$staging/"
          cp README.md LICENSE "$staging/"
          tar -czf "dist/${staging}.tar.gz" "$staging"
          ls -l dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: spanner-adbc-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # Wait for required workflows on the tagged commit before publishing.
  # The branch push accompanying cargo release supplies runs for the same SHA.
  ci-gate:
    name: Require CI + conformance green on this commit
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # read the required workflows' runs via the API.
    steps:
      - name: Wait for the required workflows to succeed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="${{ github.sha }}"
          repo="${{ github.repository }}"
          # Each required workflow must run on the main-branch push accompanying the tag.
          required=(ci.yml adbc-validation.yml foundry-validation.yml)
          # Allow 30 minutes for runs to register and complete; missing runs block publishing.
          deadline=$(( SECONDS + 1800 ))
          while true; do
            pending=()
            for wf in "${required[@]}"; do
              resp="$(gh api \
                "repos/${repo}/actions/workflows/${wf}/runs?head_sha=${sha}&per_page=1" \
                2>/dev/null || true)"
              status="$(printf '%s' "$resp" | jq -r '.workflow_runs[0].status // "none"' 2>/dev/null || echo none)"
              conclusion="$(printf '%s' "$resp" | jq -r '.workflow_runs[0].conclusion // "none"' 2>/dev/null || echo none)"
              echo "${wf} run for ${sha}: status=${status} conclusion=${conclusion}"
              if [ "$status" = "completed" ]; then
                if [ "$conclusion" != "success" ]; then
                  echo "::error::${wf} concluded '${conclusion}' on ${sha}; refusing to publish this tag." >&2
                  exit 1
                fi
              else
                pending+=("$wf")
              fi
            done
            if [ "${#pending[@]}" -eq 0 ]; then
              echo "All required workflows are green on ${sha}; allowing the release to proceed."
              exit 0
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::timed out after 30m waiting for these workflows to complete on ${sha}: ${pending[*]}" >&2
              exit 1
            fi
            sleep 20
          done

  # Require the tag to match Cargo.toml before publishing libraries or wheels.
  version-gate:
    name: Tag matches crate version
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Check the pushed tag equals the Cargo.toml version
        shell: bash
        run: |
          set -euo pipefail
          # Read the package version without resolving or fetching dependencies.
          crate_version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "spanner-adbc") | .version')"
          tag_version="${GITHUB_REF#refs/tags/v}"
          echo "tag v${tag_version} vs Cargo.toml version ${crate_version}"
          if [[ "$tag_version" != "$crate_version" ]]; then
            echo "::error::tag v$tag_version != Cargo.toml version $crate_version" >&2
            exit 1
          fi

  release:
    name: Attach to GitHub Release
    needs: [build, build-musl, ci-gate, version-gate]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download the platform library artifacts
        uses: actions/download-artifact@v8
        with:
          # Download library archives only; the wheel artifact may be uploaded concurrently.
          pattern: spanner-adbc-*
          path: dist
          merge-multiple: true

      # Stamp the release version into the driver-discovery manifest.
      # Users set Driver.shared to the extracted library path before installing it.
      - name: Stamp the release version into the driver manifest
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF#refs/tags/v}"
          # Insert `version = '...'` right after the `name = ...` key, matching the
          # key order of the specification's example manifest.
          awk -v ver="$version" '
            { print }
            !done && /^name = / { printf "version = '\''%s'\''\n", ver; done = 1 }
          ' spanner.toml > dist/spanner.toml
          python3 -c "import tomllib,sys; d=tomllib.load(open('dist/spanner.toml','rb')); \
            assert d['version'] == sys.argv[1], d.get('version'); \
            assert d['Driver']['shared'], 'no Driver.shared'; \
            print('manifest OK, version', d['version'])" "$version"

      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          set -euo pipefail
          # Include every published archive and the manifest in SHA256SUMS.
          sha256sum spanner-adbc-* spanner.toml > SHA256SUMS
          echo "Published checksums:"
          cat SHA256SUMS

      - name: Publish release assets
        # Pinned to a commit: this step runs with contents: write and publishes the release
        # assets users download — a hijacked v3 tag must not be able to replace them.
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          # dist/* now also includes the driver manifest and the generated SHA256SUMS file.
          files: dist/*
          generate_release_notes: true

  # Package prebuilt libraries as py3-none platform wheels on one runner.
  python-wheels:
    name: Python wheels
    needs: [build, build-musl]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # This Python version only packages binaries; wheels use the py3-none ABI tag.
          python-version: "3.15.0"

      - name: Install build tooling
        # The build uses the bdist_wheel command bundled with setuptools.
        run: python -m pip install --upgrade pip setuptools

      - name: Download platform libraries
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Sync wheel version to the crate
        shell: bash
        working-directory: python
        run: |
          set -euo pipefail
          # Stamp wheels with the Cargo.toml version; version-gate checks release tags.
          crate_version="$(cargo metadata --no-deps --format-version 1 --manifest-path ../Cargo.toml \
            | jq -r '.packages[] | select(.name == "spanner-adbc") | .version')"
          echo "__version__ = \"${crate_version}\"" > spanner_adbc/_version.py
          echo "wheel version: ${crate_version}"

      - name: Build wheels
        shell: bash
        working-directory: python
        run: |
          set -euo pipefail
          mkdir -p wheelhouse
          # target | lib filename | wheel platform tag.
          # NOTE: the manylinux tag matches the pinned ubuntu-22.04 build
          # runners (glibc 2.35), and the build job's "Verify glibc requirement"
          # step enforces it. Likewise the macosx tags match the build job's
          # macos_deployment_target values, enforced by its "Verify the minimum
          # macOS" step. If you change any of these tags, change the build job
          # (and its check) to match.
          rows=(
            "x86_64-unknown-linux-gnu|libspanner_adbc.so|manylinux_2_35_x86_64"
            "aarch64-unknown-linux-gnu|libspanner_adbc.so|manylinux_2_35_aarch64"
            "x86_64-unknown-linux-musl|libspanner_adbc.so|musllinux_1_2_x86_64"
            "aarch64-unknown-linux-musl|libspanner_adbc.so|musllinux_1_2_aarch64"
            "aarch64-apple-darwin|libspanner_adbc.dylib|macosx_11_0_arm64"
            "x86_64-apple-darwin|libspanner_adbc.dylib|macosx_10_15_x86_64"
            "x86_64-pc-windows-msvc|spanner_adbc.dll|win_amd64"
            "aarch64-pc-windows-msvc|spanner_adbc.dll|win_arm64"
          )
          for row in "${rows[@]}"; do
            IFS="|" read -r target lib plat <<< "$row"
            staging="spanner-adbc-${target}"
            work="$(mktemp -d)"
            if [ -f "../artifacts/${staging}.tar.gz" ]; then
              tar -xzf "../artifacts/${staging}.tar.gz" -C "$work"
            else
              unzip -q "../artifacts/${staging}.zip" -d "$work"
            fi
            # Exactly one platform's library must be present per wheel build.
            rm -f spanner_adbc/*.so spanner_adbc/*.dylib spanner_adbc/*.dll
            cp "$work/${staging}/${lib}" spanner_adbc/
            python setup.py bdist_wheel --plat-name "$plat"
            rm -rf build spanner_adbc/*.so spanner_adbc/*.dylib spanner_adbc/*.dll
          done
          mv dist/*.whl wheelhouse/
          ls -l wheelhouse

      # Check wheel metadata, bundled libraries and loading before publishing.
      - name: Check wheel metadata and that each bundles its platform library
        shell: bash
        working-directory: python
        run: |
          set -euo pipefail
          python -m pip install --upgrade twine
          # Validate each wheel's metadata / long-description rendering.
          python -m twine check wheelhouse/*.whl
          # Assert the platform shared library is actually inside every wheel — a
          # data-only wheel with no library installs fine and then fails at runtime.
          for whl in wheelhouse/*.whl; do
            case "$whl" in
              # Both manylinux (glibc) and musllinux (Alpine) tags contain "linux"
              # and bundle the same .so filename.
              *linux*) lib='spanner_adbc/libspanner_adbc.so' ;;
              *macosx*) lib='spanner_adbc/libspanner_adbc.dylib' ;;
              *win*) lib='spanner_adbc/spanner_adbc.dll' ;;
              *) echo "::error::unrecognised wheel platform tag: ${whl}" >&2; exit 1 ;;
            esac
            if ! python -m zipfile -l "$whl" | grep -qF "$lib"; then
              echo "::error::${whl} does not bundle ${lib}" >&2
              python -m zipfile -l "$whl" >&2
              exit 1
            fi
            echo "OK: ${whl} bundles ${lib}"
          done

      - name: Install the built Linux wheel and smoke-test the import
        shell: bash
        run: |
          set -euo pipefail
          # Smoke-test the installed manylinux x86_64 wheel on this glibc runner.
          # The other platform wheels are inspected above.
          whl="$(ls python/wheelhouse/*manylinux_2_35_x86_64.whl)"
          python -m pip install "$whl"
          # Import from a directory without the source tree so the *installed*
          # package is exercised; _driver_path() raises unless the lib is bundled.
          cd "$RUNNER_TEMP"
          python -c "import spanner_adbc; print(spanner_adbc._driver_path()); import spanner_adbc.dbapi"

      # Verify driver-name and URI-scheme discovery through the installed manifest.
      # Database initialization needs no Spanner connection.
      - name: Check the installed wheel's driver manifest resolves by name and URI scheme
        shell: bash
        run: |
          set -euo pipefail
          # Run from a directory without the source tree, so the *installed* package's
          # manifest (pointing at the library bundled in the wheel) is what is exercised.
          cd "$RUNNER_TEMP"
          python - <<'PY'
          import os
          import tempfile
          import tomllib

          import spanner_adbc
          import spanner_adbc.manifest as manifest

          directory = tempfile.mkdtemp()
          path = manifest.install(directory)
          doc = tomllib.load(open(path, "rb"))
          assert path.name == "spanner.toml", path
          assert doc["manifest_version"] == 1, doc
          # Driver.shared is used verbatim by the dynamic loader, so it has to be the
          # absolute path of the library this wheel bundles.
          assert doc["Driver"]["shared"] == spanner_adbc._driver_path(), doc

          os.environ["ADBC_DRIVER_PATH"] = directory
          import adbc_driver_manager

          # (1) Resolve by driver name.
          adbc_driver_manager.AdbcDatabase(driver="spanner").close()
          # (2) Resolve from the URI scheme, with no `driver` option at all.
          adbc_driver_manager.AdbcDatabase(
              uri="spanner:///projects/p/instances/i/databases/d"
          ).close()
          print(f"OK: {path} resolves driver=spanner and the spanner:// URI scheme")
          PY

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: python-wheels
          path: python/wheelhouse/*.whl
          if-no-files-found: error

  # Publish with PyPI Trusted Publishing. The PyPI publisher must match this
  # repository, libraries.yml and the pypi environment; see python/README.md.
  python-publish:
    name: Publish wheels to PyPI
    # Publish to PyPI after matching-version GitHub Release assets are attached.
    needs: [python-wheels, ci-gate, version-gate, release]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/spanner-adbc
    permissions:
      id-token: write # mandatory for trusted publishing; nothing else needed.
    steps:
      - name: Download wheels
        uses: actions/download-artifact@v8
        with:
          name: python-wheels
          path: dist

      - name: Publish to PyPI
        # Pinned to a commit: this step holds the OIDC id-token for PyPI trusted publishing
        # and sees the wheels in plaintext — release/v1 is a mutable *branch*.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          # No username/password: presence of the OIDC token triggers the
          # trusted-publishing flow. PEP 740 attestations are generated by
          # default. skip-existing keeps re-runs idempotent.
          packages-dir: dist
          skip-existing: true
