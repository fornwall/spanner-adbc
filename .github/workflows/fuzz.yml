name: Fuzz

# Reuse the generated corpus across scheduled runs, starting from committed seeds.
on:
  schedule:
    - cron: "0 3 * * *" # daily at 03:00 UTC
  workflow_dispatch:
    inputs:
      max_total_time:
        description: "Seconds to fuzz each target"
        default: "1200"

# The failure-reporting job grants its own issue-write permission.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Derive the target matrix from fuzz/Cargo.toml so new targets run automatically.
  # The unit test every_fuzz_target_is_wired checks this wiring.
  discover:
    name: discover fuzz targets
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - uses: actions/checkout@v7

      - id: list
        # Each [[bin]] entry must put name on the following line for this parser.
        run: |
          set -euo pipefail
          names="$(sed -n '/^\[\[bin\]\]/{n; s/^name *= *"\(.*\)"/\1/p}' fuzz/Cargo.toml)"
          if [ -z "$names" ]; then
            echo "!! no [[bin]] fuzz targets parsed out of fuzz/Cargo.toml" >&2
            exit 1
          fi
          targets="$(printf '%s\n' "$names" | jq -R . | jq -sc .)"
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "fuzzing $(printf '%s\n' "$names" | wc -l) target(s): $targets"

  fuzz:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.discover.outputs.targets) }}
    steps:
      - uses: actions/checkout@v7

      - name: Install nightly (cargo-fuzz needs it)
        # A SHA-pinned rust-toolchain action requires an explicit toolchain input.
        uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly branch, 2026-10-16
        with:
          toolchain: nightly

      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-fuzz@0.13.2

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # The fuzz crate shares the root workspace's target directory and lockfile.
          workspaces: ". -> target"

      # Unique keys save each successful run's corpus; restore the most recent one.
      # Failed runs upload crashes as artifacts without updating the cache.
      - name: Restore the accumulated corpus
        uses: actions/cache@v6
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ matrix.target }}-

      - name: Fuzz ${{ matrix.target }}
        # Override the prebuilt cargo-fuzz binary's musl target: sanitizers need dynamic libc.
        # Write new inputs to the first corpus directory; read committed seeds if present.
        # Pass workflow inputs through env to keep them out of shell source.
        # The release profile's thin LTO strips coverage counters from the cdylib+rlib crate,
        # which leaves libFuzzer blind; keep symbols for readable crash stacks.
        env:
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_STRIP: "false"
          FUZZ_TARGET: ${{ matrix.target }}
          MAX_TOTAL_TIME: ${{ github.event.inputs.max_total_time || '1200' }}
        run: |
          mkdir -p "fuzz/corpus/$FUZZ_TARGET"
          seeds="fuzz/seeds/$FUZZ_TARGET"
          [ -d "$seeds" ] || seeds=""
          cargo +nightly fuzz run "$FUZZ_TARGET" \
            --target x86_64-unknown-linux-gnu \
            "fuzz/corpus/$FUZZ_TARGET" ${seeds:+"$seeds"} -- \
            -max_total_time="$MAX_TOTAL_TIME" \
            -rss_limit_mb=4096

      - name: Upload any crash artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-${{ matrix.target }}-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore

  # Keep scheduled failures visible in one tracking issue.
  report-failure:
    # Include discovery failures, which prevent the fuzz jobs from starting.
    needs: [discover, fuzz]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          label="nightly-fuzz-failure"
          title="Nightly fuzz run failed"
          gh label create "$label" --color B60205 \
            --description "Automated: a scheduled fuzz run failed" 2>/dev/null || true
          body="A scheduled [fuzz run]($RUN_URL) failed (commit ${GITHUB_SHA})."
          existing="$(gh issue list --state open --label "$label" --limit 1 --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --label "$label" --body "$body"
          fi
