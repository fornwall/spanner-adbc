name: Setup Rust
description: >
  Install the version in rust-toolchain.toml with optional rustup components and targets.

inputs:
  components:
    description: Comma-separated extra rustup components to install (e.g. "rustfmt, clippy").
    required: false
    default: ""
  targets:
    description: Comma-separated extra rustup target triples to install.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Resolve pinned Rust version
      id: version
      shell: bash
      run: |
        # Pass the pinned version explicitly; sed also works on macOS runners.
        channel=$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)
        if [ -z "$channel" ]; then
          echo "::error::could not read 'channel' from rust-toolchain.toml" >&2
          exit 1
        fi
        echo "channel=$channel" >> "$GITHUB_OUTPUT"

    - name: Install Rust toolchain
      # A SHA-pinned rust-toolchain action requires an explicit toolchain input.
      uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
      with:
        toolchain: ${{ steps.version.outputs.channel }}
        components: ${{ inputs.components }}
        targets: ${{ inputs.targets }}
