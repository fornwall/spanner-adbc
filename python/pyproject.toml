[build-system]
# PEP 639 license metadata and the bundled bdist_wheel command require setuptools 77.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "spanner-adbc"
dynamic = ["version"]
description = "ADBC (Arrow Database Connectivity) driver for Google Cloud Spanner"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Fredrik Fornwall", email = "fredrik@fornwall.net" }]
keywords = ["adbc", "arrow", "spanner", "database", "gcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Rust",
    "Topic :: Database",
]
# Earlier releases bind the keys of a parameter mapping as values.
dependencies = ["adbc-driver-manager>=1.8"]

[project.optional-dependencies]
dbapi = ["adbc-driver-manager[dbapi]"]

[project.scripts]
spanner-adbc-install-manifest = "spanner_adbc.manifest:main"

[project.urls]
Homepage = "https://github.com/fornwall/spanner-adbc"
Repository = "https://github.com/fornwall/spanner-adbc"

[tool.setuptools]
packages = ["spanner_adbc"]

[tool.setuptools.dynamic]
version = { attr = "spanner_adbc._version.__version__" }

[tool.setuptools.package-data]
# CI copies the platform library into the package before building the wheel.
spanner_adbc = ["*.so", "*.dylib", "*.dll", "py.typed"]
