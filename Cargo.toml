# Fuzz targets share the root lockfile; default builds exclude the nightly-only harness.
[workspace]
members = ["fuzz"]
default-members = ["."]
# Local worktrees are separate workspaces.
exclude = [".claude"]

[package]
name = "spanner-adbc"
version = "0.9.0"
edition = "2024"
rust-version = "1.99.1"
license = "Apache-2.0"
description = "ADBC (Arrow Database Connectivity) driver for Google Cloud Spanner"
repository = "https://github.com/fornwall/spanner-adbc"
homepage = "https://github.com/fornwall/spanner-adbc"
readme = "README.md"
keywords = ["adbc", "arrow", "spanner", "database", "gcp"]
categories = ["database", "api-bindings"]
# Exclude CI, external validation harnesses and the separate Python package.
exclude = [".github/", "scripts/", "/fuzz", "/adbc-validation", "/foundry-validation", "/python"]

[package.metadata.docs.rs]
# Include the FFI entrypoints in docs.
all-features = true

# See CONTRIBUTING.md for the cargo-release workflow.
[package.metadata.release]
allow-branch = ["main"]
# Tagging triggers the shared-library and wheel release workflow.
tag-name = "v{{version}}"
tag-message = "Release {{version}}"
pre-release-commit-message = "Release {{version}}"
# Check locally before tagging; libraries.yml also requires full emulator CI on the tag.
pre-release-hook = ["sh", "-c", "cargo fmt --all --check && cargo clippy --all-targets --all-features -- -D warnings && cargo test"]
# Keep the Python development fallback version in sync; release CI uses the tag.
pre-release-replacements = [
    { file = "python/spanner_adbc/_version.py", search = "__version__ = \"[0-9][^\"]*\"", replace = "__version__ = \"{{version}}\"", exactly = 1 },
]
# crates.io rejects the git dependencies below.
publish = false
push = true

[lib]
# Loadable ADBC driver and native Rust library.
crate-type = ["cdylib", "rlib"]

[features]
default = ["ffi"]
# Disable for a pure-Rust library without unsafe code (enforced in src/lib.rs).
ffi = []
# Unstable parsing helpers and Arbitrary inputs for fuzz/.
fuzzing = ["dep:arbitrary"]

[[bench]]
# Offline Spanner-to-Arrow conversion benchmarks.
name = "conversion"
harness = false

[dependencies]
# Keep each git dependency family on one revision; see CONTRIBUTING.md for migration steps.
# ADBC main supplies InfoCode::Other, needed to omit unknown info codes.
# The C ABI is implemented in src/ffi/; adbc_ffi is only a test dependency.
adbc_core = { git = "https://github.com/apache/arrow-adbc", rev = "0a40cf30d0458867cea48d0fbc5283340b59b40f" }
# Match adbc_core’s Arrow range so its public types unify with ours.
# ffi supplies the Arrow C Data and Stream interfaces.
arrow-array = { version = ">=58, <61", features = ["ffi"] }
arrow-schema = ">=58, <61"
# List buffers and C Data Interface array validation.
arrow-buffer = ">=58, <61"
arrow-data = ">=58, <61"
# Platform-specific errno values for the Arrow C Stream Interface.
libc = "0.2"
# Keep Google Cloud crates aligned with the unpublished spanner-grpc-mock.
# Disable unused builtin-metrics (Cloud Monitoring) to reduce library size.
# Retain the default rustls crypto provider for TLS.
google-cloud-spanner = { git = "https://github.com/googleapis/google-cloud-rust", rev = "415dbbb8ec607f4ba927ed0e38366194cb09530d", default-features = false, features = ["default-rustls-provider"] }
# Anonymous, ADC and explicit credentials.
google-cloud-auth = { git = "https://github.com/googleapis/google-cloud-rust", rev = "415dbbb8ec607f4ba927ed0e38366194cb09530d" }
# Poll admin DDL operations.
google-cloud-lro = { git = "https://github.com/googleapis/google-cloud-rust", rev = "415dbbb8ec607f4ba927ed0e38366194cb09530d" }
# Structured protobuf details in Spanner errors; already a client dependency.
google-cloud-wkt = { git = "https://github.com/googleapis/google-cloud-rust", rev = "415dbbb8ec607f4ba927ed0e38366194cb09530d" }
# Bridge synchronous ADBC methods to the async Spanner client.
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync"] }
# Bound concurrent per-table statistics scans.
futures-util = "0.3"
# Preserve floats exactly when partition descriptors are decoded and re-encoded.
serde_json = { version = "1", features = ["float_roundtrip"] }
base64 = "0.23"
# Static bearer-token headers; must match google-cloud-auth’s http major version.
http = "1"
# Parse and format DATE/TIMESTAMP values without clock or timezone dependencies.
chrono = { version = "0.4", default-features = false, features = ["std"] }
# Only enabled for fuzzing.
arbitrary = { version = "1", features = ["derive"], optional = true }
# Forward structured gRPC status details into ADBC errors.
google-cloud-gax = { git = "https://github.com/googleapis/google-cloud-rust", rev = "415dbbb8ec607f4ba927ed0e38366194cb09530d" }
# Use gRPC for DDL on every backend; Omni does not expose the SDK admin client's REST API.
google-cloud-gax-internal = { git = "https://github.com/googleapis/google-cloud-rust", rev = "415dbbb8ec607f4ba927ed0e38366194cb09530d", features = ["_internal-grpc-client"] }
google-cloud-spanner-admin-database-v1 = { git = "https://github.com/googleapis/google-cloud-rust", rev = "415dbbb8ec607f4ba927ed0e38366194cb09530d" }
google-cloud-longrunning = { git = "https://github.com/googleapis/google-cloud-rust", rev = "415dbbb8ec607f4ba927ed0e38366194cb09530d" }
google-cloud-rpc = { git = "https://github.com/googleapis/google-cloud-rust", rev = "415dbbb8ec607f4ba927ed0e38366194cb09530d" }
# Wire messages for the two DDL RPCs; already used by the Spanner client.
prost = "0.14"
prost-types = "0.14"

[lints.rust]
# The C++ ASan validation harness enables this tripwire via rustflags.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(asan_canary)'] }
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
manual_let_else = "warn"
map_unwrap_or = "warn"
manual_is_variant_and = "warn"
manual_string_new = "warn"
needless_collect = "warn"

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "warn"

[profile.release]
# Thin LTO and one codegen unit reduce library size; default optimization favors throughput.
# Keep unwinding: FFI guards catch panics instead of terminating the host process.
strip = true
lto = "thin"
codegen-units = 1

# Release performance with symbols for perf and flamegraphs.
[profile.profiling]
inherits = "release"
strip = false
debug = true

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros", "sync"] }
# Property-based integration tests.
proptest = "1"
# Load the driver through the C ABI; keep the ADBC revision aligned with adbc_core.
adbc_driver_manager = { git = "https://github.com/apache/arrow-adbc", rev = "0a40cf30d0458867cea48d0fbc5283340b59b40f" }
# Independent ABI definitions for raw lifecycle tests, separate from src/ffi/abi.rs.
adbc_ffi = { git = "https://github.com/apache/arrow-adbc", rev = "0a40cf30d0458867cea48d0fbc5283340b59b40f" }
# Load raw FFI functions to test invalid lifecycle operations.
libloading = "0.9"
# Create emulator test instances and databases; keep Google Cloud revisions aligned.
google-cloud-spanner-admin-instance-v1 = { git = "https://github.com/googleapis/google-cloud-rust", rev = "415dbbb8ec607f4ba927ed0e38366194cb09530d" }
# Offline benchmarks without plotters/rayon.
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
# Offline gRPC fault injection using the pinned client’s own mock server.
spanner-grpc-mock = { git = "https://github.com/googleapis/google-cloud-rust", rev = "415dbbb8ec607f4ba927ed0e38366194cb09530d" }
# Wire messages and error details for the mock server; match the Google Cloud graph.
tonic = "0.14"
tonic-prost = "0.14"
bytes = "1"

# Arrow 60.0.0 hides FFI_ArrowArrayStream fields; main adds the needed accessors
# (apache/arrow-rs#11125). Patch all Arrow crates so adbc_core shares our types.
# Remove once a release includes them; see CONTRIBUTING.md’s registry migration checklist.
[patch.crates-io]
arrow-array = { git = "https://github.com/apache/arrow-rs", rev = "6db2d4fd99c766ecd65a90419cea717ad5fbb619" }
arrow-buffer = { git = "https://github.com/apache/arrow-rs", rev = "6db2d4fd99c766ecd65a90419cea717ad5fbb619" }
arrow-data = { git = "https://github.com/apache/arrow-rs", rev = "6db2d4fd99c766ecd65a90419cea717ad5fbb619" }
arrow-schema = { git = "https://github.com/apache/arrow-rs", rev = "6db2d4fd99c766ecd65a90419cea717ad5fbb619" }
