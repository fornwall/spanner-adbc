# Fuzz targets share the root lockfile; default builds exclude the nightly-only harness.
[workspace]
members = ["fuzz"]
default-members = ["."]
# Local worktrees are separate workspaces.
exclude = [".claude"]

[package]
name = "spanner-adbc"
version = "0.12.0"
edition = "2024"
rust-version = "1.99.1"
license = "Apache-2.0"
description = "ADBC (Arrow Database Connectivity) driver for Google Cloud Spanner"
repository = "https://github.com/fornwall/spanner-adbc"
homepage = "https://github.com/fornwall/spanner-adbc"
readme = "README.md"
keywords = ["adbc", "arrow", "spanner", "database", "gcp"]
categories = ["database", "api-bindings"]
# Exclude CI, external validation harnesses and the separate Python package.
exclude = [".github/", "scripts/", "/fuzz", "/adbc-validation", "/foundry-validation", "/python"]

[package.metadata.docs.rs]
# Include the FFI entrypoints in docs.
all-features = true

[package.metadata.cargo-machete]
# These dependencies disable upstream logging through their compile-time features.
ignored = ["log", "tracing"]

# See CONTRIBUTING.md for the cargo-release workflow.
[package.metadata.release]
allow-branch = ["main"]
# Tagging triggers the shared-library and wheel release workflow.
tag-name = "v{{version}}"
tag-message = "Release {{version}}"
pre-release-commit-message = "Release {{version}}"
# Check locally before tagging; libraries.yml also requires full emulator CI on the tag.
pre-release-hook = ["sh", "-c", "cargo fmt --all --check && cargo clippy --workspace --all-targets --all-features -- -D warnings && cargo build && cargo test"]
# Keep the Python package version in sync; libraries.yml checks that it matches.
pre-release-replacements = [
    { file = "python/spanner_adbc/_version.py", search = "__version__ = \"[0-9][^\"]*\"", replace = "__version__ = \"{{version}}\"", exactly = 1 },
]
# crates.io rejects the git dependencies below.
publish = false
push = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["ffi"]
# Disable for a pure-Rust library without unsafe code (enforced in src/lib.rs).
ffi = []
# Unstable parsing helpers and Arbitrary inputs for fuzz/.
fuzzing = ["dep:arbitrary"]
# Compile out the dependencies' tracing and log events, which nothing can observe in a loaded
# library. The release workflow enables it; in a Rust application it would silence every crate.
strip-logging = ["dep:tracing", "dep:log", "tracing/max_level_off", "log/max_level_off"]

[[bench]]
name = "conversion"
harness = false

[dependencies]
# Keep each git dependency family on one revision; see CONTRIBUTING.md for migration steps.
# ADBC main supplies InfoCode::Other, needed to omit unknown info codes.
# The C ABI is implemented in src/ffi/; adbc_ffi is only a test dependency.
adbc_core = { git = "https://github.com/apache/arrow-adbc", rev = "aa2c1c2496d287e111d70d382e5d9af07568488b" }
# Arrow 60.1 supplies the C Stream constructor and accessors used by the C ABI.
# Stay within adbc_core's Arrow range so its public types unify with ours.
# ffi supplies the Arrow C Data and Stream interfaces.
arrow-array = { version = "60.1", features = ["ffi"] }
arrow-schema = "60.1"
# List buffers and C Data Interface array validation.
arrow-buffer = "60.1"
arrow-data = "60.1"
# Platform-specific errno values for the Arrow C Stream Interface.
libc = "0.2"
# Keep Google Cloud crates aligned with the unpublished spanner-grpc-mock.
# Disable unused builtin-metrics (Cloud Monitoring) to reduce library size.
# Retain the default rustls crypto provider for TLS.
google-cloud-spanner = { git = "https://github.com/googleapis/google-cloud-rust", rev = "5a2297f47973775e925ce49d37971b03ce358fba", default-features = false, features = ["default-rustls-provider"] }
# Anonymous, ADC and explicit credentials.
google-cloud-auth = { git = "https://github.com/googleapis/google-cloud-rust", rev = "5a2297f47973775e925ce49d37971b03ce358fba" }
# Poll admin DDL operations.
google-cloud-lro = { git = "https://github.com/googleapis/google-cloud-rust", rev = "5a2297f47973775e925ce49d37971b03ce358fba" }
# Structured protobuf details in Spanner errors; already a client dependency.
google-cloud-wkt = { git = "https://github.com/googleapis/google-cloud-rust", rev = "5a2297f47973775e925ce49d37971b03ce358fba" }
# Bridge synchronous ADBC methods to the async Spanner client.
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync"] }
# Bound concurrent per-table statistics scans.
futures-util = "0.3"
# Preserve floats exactly when partition descriptors are decoded and re-encoded.
serde_json = { version = "1", features = ["float_roundtrip"] }
base64 = "0.23"
# Static bearer-token headers; must match google-cloud-auth's http major version.
http = "1"
# Format bound DATE and TIMESTAMP values; results decode without it. arrow-array enables its
# clock feature regardless.
chrono = { version = "0.4", default-features = false, features = ["std"] }
arbitrary = { version = "1", features = ["derive"], optional = true }
# Forward structured gRPC status details into ADBC errors.
google-cloud-gax = { git = "https://github.com/googleapis/google-cloud-rust", rev = "5a2297f47973775e925ce49d37971b03ce358fba" }
# Use gRPC for DDL on every backend; Omni does not expose the SDK admin client's REST API.
google-cloud-gax-internal = { git = "https://github.com/googleapis/google-cloud-rust", rev = "5a2297f47973775e925ce49d37971b03ce358fba", features = ["_internal-grpc-client"] }
google-cloud-spanner-admin-database-v1 = { git = "https://github.com/googleapis/google-cloud-rust", rev = "5a2297f47973775e925ce49d37971b03ce358fba" }
google-cloud-longrunning = { git = "https://github.com/googleapis/google-cloud-rust", rev = "5a2297f47973775e925ce49d37971b03ce358fba" }
google-cloud-rpc = { git = "https://github.com/googleapis/google-cloud-rust", rev = "5a2297f47973775e925ce49d37971b03ce358fba" }
# Wire messages for the two DDL RPCs; already used by the Spanner client.
prost = "0.14"
prost-types = "0.14"
tracing = { version = "0.1", optional = true }
log = { version = "0.4", optional = true }

[lints.rust]
# The C++ ASan validation harness enables this tripwire via rustflags.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(asan_canary)'] }
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
manual_let_else = "warn"
map_unwrap_or = "warn"
manual_is_variant_and = "warn"
manual_string_new = "warn"
needless_collect = "warn"

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "warn"

[profile.release]
# Thin LTO and one codegen unit reduce library size; default optimization favors throughput.
# Keep unwinding: FFI guards catch panics instead of terminating the host process.
strip = true
lto = "thin"
codegen-units = 1

# At opt-level "s", aws-lc builds with OPENSSL_SMALL, dropping AVX-512 AES-GCM and the P-256
# assembly. Bulk AES-GCM stays above 3 GB/s per core; only TLS handshakes pay for slower P-256.
[profile.release.package.aws-lc-sys]
opt-level = "s"

# Credentials and token fetches, reqwest's only use, stay off the per-row path.
[profile.release.package.google-cloud-auth]
opt-level = "s"
[profile.release.package.reqwest]
opt-level = "s"

# Release performance with symbols for perf and flamegraphs.
[profile.profiling]
inherits = "release"
strip = false
debug = true

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros", "sync"] }
proptest = "1"
# Load the driver through the C ABI; keep the ADBC revision aligned with adbc_core.
adbc_driver_manager = { git = "https://github.com/apache/arrow-adbc", rev = "aa2c1c2496d287e111d70d382e5d9af07568488b" }
# Independent ABI definitions for raw lifecycle tests, separate from src/ffi/abi.rs.
adbc_ffi = { git = "https://github.com/apache/arrow-adbc", rev = "aa2c1c2496d287e111d70d382e5d9af07568488b" }
# Load raw FFI functions to test invalid lifecycle operations.
libloading = "0.9"
# Create emulator test instances and databases; keep Google Cloud revisions aligned.
google-cloud-spanner-admin-instance-v1 = { git = "https://github.com/googleapis/google-cloud-rust", rev = "5a2297f47973775e925ce49d37971b03ce358fba" }
# Offline benchmarks without plotters/rayon.
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
# Offline gRPC fault injection using the pinned client's own mock server.
spanner-grpc-mock = { git = "https://github.com/googleapis/google-cloud-rust", rev = "5a2297f47973775e925ce49d37971b03ce358fba" }
# Wire messages and error details for the mock server; match the Google Cloud graph.
tonic = "0.14"
tonic-prost = "0.14"
bytes = "1"
