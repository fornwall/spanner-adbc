# Supply-chain checks for `cargo deny check`, also run in CI.

[graph]
all-features = true

[advisories]
# Fail on security vulnerabilities; warn on yanked dependencies.
yanked = "warn"
ignore = []

[licenses]
# aws-lc-sys requires ISC, Apache-2.0, MIT and BSD-3-Clause together.
allow = [
    "Apache-2.0",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "Apache-2.0 WITH LLVM-exception",
]
confidence-threshold = 0.9
# Retain license entries across dependency updates.
unused-allowed-license = "allow"

[bans]
# The tree resolves multiple versions of some common crates; report but don't fail.
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# The google-cloud-* crates share a revision with the unpublished spanner-grpc-mock;
# adbc_* tracks upstream main with the validation suite; arrow-* needs unreleased
# FFI_ArrowArrayStream APIs (see Cargo.toml).
allow-git = [
    "https://github.com/googleapis/google-cloud-rust",
    "https://github.com/apache/arrow-adbc",
    "https://github.com/apache/arrow-rs",
]
