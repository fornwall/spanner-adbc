# ADBC driver manifest for the Google Cloud Spanner driver. With a driver manager
# that supports manifests, select it by name or by URI scheme alone:
#
#     driver = "spanner"
#     uri    = "spanner:///projects/p/instances/i/databases/d"
#
# Install as `spanner.toml` in a directory on `ADBC_DRIVER_PATH` or in a user or
# system config directory; see
# https://arrow.apache.org/adbc/current/format/driver_manifests.html
#
# Edit `Driver.shared` to point at the installed library. Paths must be absolute or
# resolvable by the dynamic loader; they are not relative to this file.
#
# The Python package generates its own manifest: `python -m spanner_adbc.manifest install`.

manifest_version = 1

name = 'Google Cloud Spanner'
publisher = 'fornwall'
license = 'Apache-2.0'
url = 'https://github.com/fornwall/spanner-adbc'

[ADBC]
# Supports ADBC 1.0.0 and 1.1.0 callers.
version = '1.1.0'

[Driver]
# AdbcDriverInit is also exported as a fallback.
entrypoint = 'AdbcSpannerInit'

# Platform tuples for the eight targets built by .github/workflows/libraries.yml.
[Driver.shared]
linux_amd64 = '/usr/local/lib/libspanner_adbc.so'
linux_arm64 = '/usr/local/lib/libspanner_adbc.so'
linux_amd64_musl = '/usr/local/lib/libspanner_adbc.so'
linux_arm64_musl = '/usr/local/lib/libspanner_adbc.so'
macos_arm64 = '/usr/local/lib/libspanner_adbc.dylib'
macos_amd64 = '/usr/local/lib/libspanner_adbc.dylib'
windows_amd64 = 'C:\Program Files\ADBC\Drivers\spanner_adbc.dll'
windows_arm64 = 'C:\Program Files\ADBC\Drivers\spanner_adbc.dll'
