# ADBC driver manifest for the Google Cloud Spanner driver.
#
# Load by name with an ADBC driver manager that supports manifests:
#
#     driver = "spanner"
#     uri    = "spanner:///projects/p/instances/i/databases/d"
#
# Without `driver`, the URI scheme selects the driver name.
# Specification: https://arrow.apache.org/adbc/current/format/driver_manifests.html
#
# Install as `spanner.toml` in a driver discovery directory. Search order:
#
#   1. every directory in the `ADBC_DRIVER_PATH` environment variable
#      (`:`-separated on Unix, `;`-separated on Windows)
#   2. additional search paths supplied by the caller — notably, the Python
#      driver manager adds `$VIRTUAL_ENV/etc/adbc/drivers` inside a venv
#   3. the user config directory
#        Linux:   `$XDG_CONFIG_HOME/adbc/drivers`, else `~/.config/adbc/drivers`
#        macOS:   `~/Library/Application Support/ADBC/Drivers`
#        Windows: `HKEY_CURRENT_USER\SOFTWARE\ADBC\Drivers\spanner`, else
#                 `%LOCALAPPDATA%\ADBC\Drivers`
#   4. the system config directory
#        Linux:   `/etc/adbc/drivers`
#        macOS:   `/Library/Application Support/ADBC/Drivers`
#        Windows: `HKEY_LOCAL_MACHINE\SOFTWARE\ADBC\Drivers\spanner`
#
# Edit `Driver.shared` below to match the installed library. Paths must be absolute
# or resolvable by the platform's dynamic loader; they are not relative to this file.
# The defaults assume a system-wide installation of a GitHub release library.
#
# For the Python package, generate a manifest pointing at its bundled library:
#
#     python -m spanner_adbc.manifest install

manifest_version = 1

name = 'Google Cloud Spanner'
publisher = 'fornwall'
license = 'Apache-2.0'
url = 'https://github.com/fornwall/spanner-adbc'
source = 'https://github.com/fornwall/spanner-adbc'

[ADBC]
# Supports ADBC 1.0.0 and 1.1.0 callers.
version = '1.1.0'

[Driver]
# AdbcDriverInit is also exported as a fallback.
entrypoint = 'AdbcSpannerInit'

# Platform tuples for the eight targets built by .github/workflows/libraries.yml.
[Driver.shared]
linux_amd64 = '/usr/local/lib/libspanner_adbc.so'
linux_arm64 = '/usr/local/lib/libspanner_adbc.so'
linux_amd64_musl = '/usr/local/lib/libspanner_adbc.so'
linux_arm64_musl = '/usr/local/lib/libspanner_adbc.so'
macos_arm64 = '/usr/local/lib/libspanner_adbc.dylib'
macos_amd64 = '/usr/local/lib/libspanner_adbc.dylib'
windows_amd64 = 'C:\Program Files\ADBC\Drivers\spanner_adbc.dll'
windows_arm64 = 'C:\Program Files\ADBC\Drivers\spanner_adbc.dll'
